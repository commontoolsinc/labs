name: Notify Rapids

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📋 Report unconfigured notification
        if: vars.RAPIDS_APP_ID == ''
        run: >-
          echo '::notice::Rapids notifications need RAPIDS_APP_ID and
          RAPIDS_APP_PRIVATE_KEY; see commonfabric/infra releases/rapids.md.'
      - name: 🔑 Create infra-only dispatch token
        if: vars.RAPIDS_APP_ID != ''
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RAPIDS_APP_ID }}
          private-key: ${{ secrets.RAPIDS_APP_PRIVATE_KEY }}
          owner: commonfabric
          repositories: infra
          permission-actions: write
          permission-contents: read
      - name: 📤 Notify the infra coordinator
        if: vars.RAPIDS_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          gh api --method POST \
            repos/commonfabric/infra/actions/workflows/rapids.yml/dispatches \
            -f ref=main -f 'inputs[producer]=commonfabric/labs' \
            -f "inputs[run_id]=$PRODUCER_RUN"
