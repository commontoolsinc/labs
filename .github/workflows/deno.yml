name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Runs of a pull request are grouped by the pull request, and a new push to the
# branch cancels the run already going. Runs of a push to main are grouped by
# the commit that was pushed, and a push run is never cancelled: it may be
# part-way through deploying that commit to staging. Main can receive the same
# head commit twice, which starts two runs of one commit, and the commit as the
# group makes the second of them wait for the first. Each run publishes a
# release artifact named after the commit, and two runs publishing at once
# leave one run's tarball beside the other run's checksum. See "One commit, one
# set of artifacts" in docs/development/deploying.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The bounds the jobs below are built from. They are YAML anchors, used as
# aliases at each job and each work step, so the numbers live here and nowhere
# else. The first pair is what a job that builds or reports takes. The lane
# pairs are the budgets `tasks/test-selection/policy.ts` packs against, written
# in minutes: a pull-request lane is packed to finish inside five, and a lane of
# the full run inside ten. See "Step And Job Timeouts" in
# docs/development/CI_PERFORMANCE.md for the sizing rule. The environment
# variables holding the numbers are how a workflow declares a value an anchor
# can name; nothing reads them.
env:
  # GitHub's Ubuntu image includes Chrome. Astral uses it directly instead of
  # downloading another browser when the first browser test starts.
  ASTRAL_BIN_PATH: /usr/bin/google-chrome
  WORK_TIMEOUT_MINUTES: &work-timeout 30
  JOB_TIMEOUT_MINUTES: &job-timeout 40
  LANE_WORK_TIMEOUT_MINUTES: &lane-work-timeout 5
  LANE_JOB_TIMEOUT_MINUTES: &lane-job-timeout 15
  FULL_LANE_WORK_TIMEOUT_MINUTES: &full-lane-work-timeout 10
  FULL_LANE_JOB_TIMEOUT_MINUTES: &full-lane-job-timeout 20

# Every step name must begin with a phase-marker emoji (setup / work / shutdown).
# scripts/ci-gantt.ts reads that emoji to split each job bar by phase. See the
# "Step phase markers" table in docs/development/CI_PERFORMANCE.md for the
# vocabulary and which emoji belongs to which phase.
#
# Every work step carries a bound of its own, and the bound on the job around it
# is at least ten minutes longer. GitHub ends a job that runs past its bound by
# cancelling it, while a step that reaches its own bound fails. An individual
# wedged step normally reaches its bound first; the job bound remains the final
# limit when several sequential steps take unusually long.
# tasks/ci-workflow.test.ts holds every work step here to that shape, and
# refuses a bound written as anything but an alias.
#
# The deploy jobs at the end carry no bound. Each hands the work to a script
# that lives elsewhere, and how long that takes is not this workflow's to say.
jobs:
  # ---------------------------------------------------------------------------
  # The full run. A push to main runs every test the topology holds, and a pull
  # request labelled "ci: full" runs the same two jobs against its own tree, so
  # opting out of selection runs exactly what main runs rather than an
  # approximation of it. How many lanes that takes depends on how much work the
  # tree holds, which is why one job works the number out first.
  # ---------------------------------------------------------------------------
  plan-full:
    name: "Plan Full Run"
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'ci: full')
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    permissions:
      contents: read
    outputs:
      lanes: ${{ steps.count.outputs.lanes }}
      matrix: ${{ steps.count.outputs.matrix }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # An integer is the whole of what passes from here to the lanes. Each
      # lane reads the same tree against the same manifest and packs its own
      # share, exactly as the pull-request lanes do, so nothing about which
      # tests run travels through a job output and there is no second packing
      # anywhere to disagree with theirs. The list beside it is that integer
      # spelled the way strategy.matrix reads one.
      - name: 📊 Count the lanes the full run needs
        id: count
        timeout-minutes: *work-timeout
        env:
          TEST_RECORDS_BUCKET: ${{ vars.TEST_RECORDS_BUCKET }}
          TEST_RECORDS_PREFIX: ${{ vars.TEST_RECORDS_PREFIX }}
          TEST_SELECTION_PREFIX: ${{ vars.TEST_SELECTION_PREFIX }}
        run: |
          lanes=$(deno run -A tasks/ci-lane.ts --full --lane-count)
          printf 'lanes=%s\n' "$lanes" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$(seq "$lanes" | jq -sc .)" >> "$GITHUB_OUTPUT"
          printf 'The full run takes %s lanes.\n' "$lanes" >> "$GITHUB_STEP_SUMMARY"

  full-tests:
    name: "Full Tests (${{ matrix.lane }}/${{ needs.plan-full.outputs.lanes }})"
    needs: ["plan-full"]
    runs-on: ubuntu-latest
    timeout-minutes: *full-lane-job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan-full.outputs.matrix) }}
    steps:
      # Full depth, so the gates that read the revision a change is measured
      # against have it, and so the suites that replay a recorded vintage do.
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # One step covering one directory, so the workflow stays independent of
      # which capabilities the lane turns out to open. Everything a lane wants
      # restored — the binaries it may build and the pattern compile byte
      # cache — sits under it.
      - name: ♻️ Restore what the lane keeps between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: &lane-cache
          path: .ci-cache
          # An exact key over the sources a binary is built from, with no
          # restore-key prefix: a capability that finds a binary uses it, so
          # a prefix would hand it one built from other sources. The lane
          # number is part of the key because the packing is stable, so lane
          # N tends to want the same binaries run after run, and five lanes
          # saving one key would keep only whichever finished first.
          key: >-
            lane-${{ matrix.lane }}-${{ hashFiles('deno.lock', 'deno.jsonc',
            'tasks/build-binaries.ts', 'packages/**/*.ts',
            'packages/**/*.tsx', 'packages/**/*.json',
            'packages/**/*.jsonc', 'packages/**/*.css',
            'packages/**/*.html') }}

      # `deno lint` has crashed natively here before, and a stack from the
      # dump is what says where. The pattern is a property of the machine
      # rather than of any one suite, so it is set for whatever the lane
      # turns out to run.
      - name: 🔧 Enable native crash dumps
        shell: bash
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$GITHUB_WORKSPACE/deno-core.%p"

      - name: 🧪 Run the lane
        timeout-minutes: *full-lane-work-timeout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RECORDS_BUCKET: ${{ vars.TEST_RECORDS_BUCKET }}
          TEST_RECORDS_PREFIX: ${{ vars.TEST_RECORDS_PREFIX }}
          TEST_SELECTION_PREFIX: ${{ vars.TEST_SELECTION_PREFIX }}
        run: >-
          deno run -A tasks/ci-lane.ts --full
          --lane ${{ matrix.lane }} --of ${{ needs.plan-full.outputs.lanes }}

      # What a failing lane left behind: a server's log, a restored binary's
      # output, and a native crash dump. The lane keeps its own working
      # directory when it fails, and removes it when it passes.
      - name: 📋 Upload what a failing lane left behind
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-failure-${{ github.job }}-${{ matrix.lane }}-a${{ github.run_attempt }}
          path: |
            deno-core.*
            ${{ runner.temp }}/ci-lane-*
          if-no-files-found: ignore
          retention-days: 14

      - name: 📤 Upload the lane's coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-full-lane-${{ matrix.lane }}
          path: coverage/lcov
          retention-days: 90
          # A lane that ran nothing measurable writes no report, which is an
          # ordinary outcome of packing rather than a fault.
          if-no-files-found: ignore

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: full-lane-${{ matrix.lane }}
          job: Full Tests (${{ matrix.lane }}/${{ needs.plan-full.outputs.lanes }})

  # ---------------------------------------------------------------------------
  # The pull-request run. Five lanes, and nothing else, unless the pull request
  # carries the "ci: full" label — in which case the two jobs above run instead
  # and these do not. One or the other, never both: running both would mean a
  # pull request could still be blocked by the selection path it had just asked
  # to be excused from.
  # ---------------------------------------------------------------------------
  pr-tests:
    name: "PR Tests (${{ matrix.lane }}/5)"
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'ci: full')
    runs-on: ubuntu-latest
    timeout-minutes: *lane-job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4, 5]
    steps:
      # Full depth and the origin/<base> spelling are what it takes to diff
      # against the merge base.
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: ♻️ Restore what the lane keeps between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: *lane-cache

      # `deno lint` has crashed natively here before, and a stack from the
      # dump is what says where. The pattern is a property of the machine
      # rather than of any one suite, so it is set for whatever the lane
      # turns out to run.
      - name: 🔧 Enable native crash dumps
        shell: bash
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$GITHUB_WORKSPACE/deno-core.%p"

      - name: 🧪 Run the lane
        timeout-minutes: *lane-work-timeout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RECORDS_BUCKET: ${{ vars.TEST_RECORDS_BUCKET }}
          TEST_RECORDS_PREFIX: ${{ vars.TEST_RECORDS_PREFIX }}
          TEST_SELECTION_PREFIX: ${{ vars.TEST_SELECTION_PREFIX }}
        run: >-
          deno run -A tasks/ci-lane.ts
          --lane ${{ matrix.lane }} --of 5
          --base origin/${{ github.base_ref }}

      # What a failing lane left behind: a server's log, a restored binary's
      # output, and a native crash dump. The lane keeps its own working
      # directory when it fails, and removes it when it passes.
      - name: 📋 Upload what a failing lane left behind
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-failure-${{ github.job }}-${{ matrix.lane }}-a${{ github.run_attempt }}
          path: |
            deno-core.*
            ${{ runner.temp }}/ci-lane-*
          if-no-files-found: ignore
          retention-days: 14

      - name: 📤 Upload the lane's coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-pr-lane-${{ matrix.lane }}
          path: coverage/lcov
          retention-days: 90
          if-no-files-found: ignore

      # The ship step carries neither a variant nor a JUnit specification,
      # which is the last piece of per-suite knowledge to leave this
      # workflow. A lane may hold default and non-default batches at once, so
      # a job-wide variant could not represent it; the lane runner gathers
      # each batch's records as it finishes and applies the suite's own
      # variant there.
      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: pr-lane-${{ matrix.lane }}
          job: PR Tests (${{ matrix.lane }}/5)

  # ---------------------------------------------------------------------------
  # The binaries a release is made of. The lanes compile each of these as a
  # test of its own, so a pull request finds a broken compile without paying
  # for an artifact nothing on that path consumes. These jobs produce the
  # artifact, which is what attestation and the deploys below need, so they
  # run where there is something to release.
  # ---------------------------------------------------------------------------
  build-toolshed:
    name: "Build Binary (toolshed)"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # The co-presence endpoint the shell EMBEDDED IN THIS BINARY offers to
      # collaborative editors. `SHELL_PRESENCE_URL` is the repository variable
      # holding the value; `PRESENCE_URL` is the process variable
      # packages/shell/felt.config.ts reads and bakes in as the
      # `$PRESENCE_URL` define — the same mapping deploy-shell-staging makes
      # for the bucket shell, from its own variable. This binary is the one
      # both estuary and rapids deploy, so both carry whatever is baked here,
      # and changing the variable takes a rebuild before it reaches either.
      # Unset omits the define and co-presence stays disabled, which is why
      # this does not fail the way an unset API URL does: a shell with no
      # presence endpoint is a working shell. The job then succeeds either way,
      # so which of the two shells a binary carries would leave no trace in it;
      # the step says which, and the log is where that answer is.
      - name: 🔎 Validate the embedded shell's presence endpoint
        timeout-minutes: *work-timeout
        env:
          PRESENCE_URL: ${{ vars.SHELL_PRESENCE_URL }}
        run: |
          if [ -n "$PRESENCE_URL" ]; then
            # `deno eval` holds every permission implicitly, so the module read
            # and the environment lookup need no flags; the subcommand takes no
            # `--allow-read` or `--allow-env` and fails on either as an unknown
            # argument. What reaches GITHUB_ENV is `URL.href`, so it is the
            # normalized spelling the bundle carries and the grep below matches.
            PRESENCE_URL="$(deno eval '
              import { optionalPresenceUrl } from "./packages/shell/src/lib/presence-url.ts";
              console.log(optionalPresenceUrl(Deno.env.get("PRESENCE_URL"))?.href ?? "");
            ')"
            echo "PRESENCE_URL=$PRESENCE_URL" >> "$GITHUB_ENV"
            echo "The embedded shell gets presence service $PRESENCE_URL."
          else
            echo "SHELL_PRESENCE_URL is unset: the embedded shell gets no presence endpoint, so editor co-presence is off in every deployment of this binary."
          fi

      - name: 🏗️ Build toolshed binary
        timeout-minutes: *work-timeout
        run: |
          deno task build-binaries toolshed

          # shell-frontend is what the binary serves in production. An endpoint
          # that was configured but did not reach the bundle would deploy a
          # shell whose co-presence is silently off, and nothing downstream
          # looks, so confirm the define landed before the binary is uploaded.
          if [ -n "$PRESENCE_URL" ] && \
            ! grep -rqF -e "$PRESENCE_URL" packages/toolshed/shell-frontend/scripts; then
            echo "::error::The embedded shell does not reference $PRESENCE_URL."
            exit 1
          fi
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: 📤 Upload toolshed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-toolshed
          path: ./dist/toolshed
          if-no-files-found: error
  build-bg-piece-service:
    name: "Build Binary (bg-piece-service)"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🏗️ Build bg-piece-service binary
        timeout-minutes: *work-timeout
        run: deno task build-binaries bg-piece-service

      - name: 📤 Upload bg-piece-service binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-bg-piece-service
          path: ./dist/bg-piece-service
          if-no-files-found: error
  build-cf:
    name: "Build Binary (cf)"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🏗️ Build cf binary
        timeout-minutes: *work-timeout
        run: deno task build-binaries cf

      - name: 📤 Upload cf binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-cf
          path: ./dist/cf
          if-no-files-found: error

  # The repository-wide coverage figure and each measured set's baseline, both
  # from the reports the full run's lanes wrote. Neither gates anything: a
  # landed change that leaves one more line uncovered must not turn main red,
  # and what it does instead is reach the pull request behind it through the
  # run report. The job reads every lane's coverage artifact, so no lane can
  # be asked to run it and it writes no test records.
  # `docs/specs/test-records.md` under "Recording" holds the criterion.
  coverage-report:
    name: "Coverage Report"
    if: github.event_name == 'push'
    needs: ["full-tests"]
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 📥 Download the lanes' coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-full-lane-*
          path: coverage-artifacts
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error

      # Best-effort. The figures are a trend and a set of baselines, and a
      # reader of either is built to carry the previous value forward, so a
      # measurement this run could not make costs the trend a point rather
      # than costing the branch its color.
      - name: 📊 Publish what the run measured
        timeout-minutes: *work-timeout
        continue-on-error: true
        run: >-
          deno run -A tasks/coverage-report.ts
          --reports coverage-artifacts
          --run-id ${{ github.run_id }}
          --sha ${{ github.sha }}
          --created-at ${{ github.event.head_commit.timestamp }}

      # Named perf-metrics for continuity: the run report and the publisher
      # both read recent main runs' artifacts by this name.
      - name: 📤 Upload the coverage baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-metrics
          path: perf-metrics.json
          retention-days: 90
          if-no-files-found: ignore

  status:
    name: "Status"
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - pr-tests
      - full-tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      # The merge base, which the coverage gate diffs against and which the
      # baselines are walked back through.
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # Whichever path ran. A labelled pull request runs the full lanes and
      # measures every set whole, so the gate reads the same reports either
      # way.
      - name: 📥 Download the lanes' coverage reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*-lane-*
          path: coverage-artifacts
          merge-multiple: false

      # Two clauses rather than one. "Every dependency succeeded or skipped"
      # on its own reports green on a pull request that ran no tests at all —
      # a mislabelled pull request, or an `if:` that excludes both paths —
      # and that is the one failure of this design that would otherwise be
      # silent, so it is asserted directly.
      - name: 🔎 Verify pull request jobs
        timeout-minutes: *work-timeout
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ' <<< "$JOB_RESULTS")

          if [[ -n "$failures" ]]; then
            printf 'Unsuccessful pull request jobs:\n%s\n' "$failures"
            exit 1
          fi

          ran=$(jq -r '
            [to_entries[]
             | select(.key == "pr-tests" or .key == "full-tests")
             | select(.value.result == "success")]
            | length
          ' <<< "$JOB_RESULTS")

          if [[ "$ran" -eq 0 ]]; then
            printf 'Neither pr-tests nor full-tests ran this pull request.\n'
            exit 1
          fi

      # Which sets the gate covers is worked out here from the topology and
      # the diff, by the same function the lanes run, rather than read out of
      # what a lane reported. Two answers to that question would let a lane
      # talk this into gating something it did not measure.
      - name: 📊 Run the coverage gate
        if: always()
        timeout-minutes: *work-timeout
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          TESTS_FAILED: ${{ needs.pr-tests.result == 'failure' || needs.full-tests.result == 'failure' }}
          TEST_RECORDS_BUCKET: ${{ vars.TEST_RECORDS_BUCKET }}
          TEST_RECORDS_PREFIX: ${{ vars.TEST_RECORDS_PREFIX }}
          TEST_SELECTION_PREFIX: ${{ vars.TEST_SELECTION_PREFIX }}
        run: |
          args=(--base "origin/${{ github.base_ref }}")
          args+=(--reports coverage-artifacts --body "$PR_BODY")
          if [[ "$TESTS_FAILED" == "true" ]]; then
            args+=(--tests-failed)
          fi
          deno run -A tasks/coverage-gate.ts "${args[@]}"

  attest-binaries:
    name: "Attest and Upload Binaries"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    # A release artifact must not outlive a failed pattern-migration gate.
    # Production deploys consume this artifact without rerunning those gates.
    # The deployed-topology gate exercises the binaries this job attests at
    # the first-party default, so a binary that fails it must not deploy.
    needs:
      [
        "full-tests",
        "build-toolshed",
        "build-bg-piece-service",
        "build-cf",
      ]
    environment: ci
    permissions:
      id-token: write
      contents: read
      actions: read
      attestations: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Download toolshed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-toolshed
          path: common-binaries

      - name: 📥 Download bg-piece-service binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-bg-piece-service
          path: common-binaries

      - name: 📥 Download cf binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-cf
          path: common-binaries

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      # Merge every job's LCOV report into one line-coverage file with
      # repository-relative paths, so IDE users can download a single artifact
      # covering the whole repository. Uploaded to Cloud Storage below alongside
      # the signed binaries. Best-effort: a coverage problem must not block
      # binary attestation or the deploys that depend on it.
      - name: 📥 Download coverage reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-full-lane-*
          path: coverage-artifacts

      - name: 🧬 Combine coverage LCOV
        timeout-minutes: *work-timeout
        continue-on-error: true
        run: |
          deno run --allow-read --allow-write tasks/combine-coverage-lcov.ts \
            --input-dir=coverage-artifacts \
            --output=release/labs-${{ github.sha }}.lcov \
            --repo-name=${{ github.event.repository.name }}

      - name: 🔐 Process & sign binaries
        timeout-minutes: *work-timeout
        run: |
          mkdir -p release
          mkdir -p signed

          mv ./common-binaries ./dist

          # Process toolshed binary
          echo "Processing binary: toolshed"
          sha256sum ./dist/toolshed > ./dist/toolshed.hash.txt
          TOOLSHED_HASH=$(cat ./dist/toolshed.hash.txt | awk '{print $1}')
          echo "toolshed hash: $TOOLSHED_HASH"
          echo "toolshed_hash=$TOOLSHED_HASH" >> $GITHUB_OUTPUT

          # Sign the toolshed binary
          openssl dgst -sha256 -sign <(echo "${{ secrets.ARTIFACT_SIGNING_KEY }}") -out ./dist/toolshed.sig ./dist/toolshed

          # Copy to signed directory
          cp ./dist/toolshed ./signed/
          cp ./dist/toolshed.sig ./signed/

          # Process bg-piece-service binary
          echo "Processing binary: bg-piece-service"
          sha256sum ./dist/bg-piece-service > ./dist/bg-piece-service.hash.txt
          BG_PIECE_SERVICE_HASH=$(cat ./dist/bg-piece-service.hash.txt | awk '{print $1}')
          echo "bg-piece-service hash: $BG_PIECE_SERVICE_HASH"
          echo "bg_piece_service_hash=$BG_PIECE_SERVICE_HASH" >> $GITHUB_OUTPUT

          # Sign the bg-piece-service binary
          openssl dgst -sha256 -sign <(echo "${{ secrets.ARTIFACT_SIGNING_KEY }}") -out ./dist/bg-piece-service.sig ./dist/bg-piece-service

          # Copy to signed directory
          cp ./dist/bg-piece-service ./signed/
          cp ./dist/bg-piece-service.sig ./signed/

          # Process cf binary
          echo "Processing binary: cf"
          sha256sum ./dist/cf > ./dist/cf.hash.txt
          CF_HASH=$(cat ./dist/cf.hash.txt | awk '{print $1}')
          echo "cf hash: $CF_HASH"
          echo "cf_hash=$CF_HASH" >> $GITHUB_OUTPUT

          # Sign the cf binary
          openssl dgst -sha256 -sign <(echo "${{ secrets.ARTIFACT_SIGNING_KEY }}") -out ./dist/cf.sig ./dist/cf

          # Copy to signed directory
          cp ./dist/cf ./signed/
          cp ./dist/cf.sig ./signed/

          # Create a single tarball with all binaries and signatures
          tar -czf release/labs-${{ github.sha }}.tar.gz -C signed .

          # Generate hash for the tarball
          sha256sum release/labs-${{ github.sha }}.tar.gz > release/labs-${{ github.sha }}.hash.txt
          TARBALL_HASH=$(cat release/labs-${{ github.sha }}.hash.txt | awk '{print $1}')
          echo "Tarball hash: $TARBALL_HASH"
          echo "tarball_hash=$TARBALL_HASH" >> $GITHUB_OUTPUT
        id: binary_processing

      - name: 📝 Generate attestation for toolshed binary
        id: attest_toolshed
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ./dist/toolshed
          subject-digest: sha256:${{ steps.binary_processing.outputs.toolshed_hash }}

      - name: 📝 Generate attestation for bg-piece-service binary
        id: attest_bg_piece_service
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ./dist/bg-piece-service
          subject-digest: sha256:${{ steps.binary_processing.outputs.bg_piece_service_hash }}

      - name: 📝 Generate attestation for cf binary
        id: attest_cf
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ./dist/cf
          subject-digest: sha256:${{ steps.binary_processing.outputs.cf_hash }}

      - name: 📝 Generate attestation for tarball
        id: attest_tarball
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.tar.gz
          subject-digest: sha256:${{ steps.binary_processing.outputs.tarball_hash }}

      - name: 📤 Upload attestations as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary_attestations
          if-no-files-found: error
          path: |
            ${{ steps.attest_toolshed.outputs.bundle-path }}
            ${{ steps.attest_bg_piece_service.outputs.bundle-path }}
            ${{ steps.attest_cf.outputs.bundle-path }}
            ${{ steps.attest_tarball.outputs.bundle-path }}

      - name: 🔎 Verify binary attestations
        timeout-minutes: *work-timeout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify tarball attestation
          echo "::group::Tarball attestation details"
          gh attestation verify release/labs-${{ github.sha }}.tar.gz -R ${{ github.repository }} --format json | jq
          echo "::endgroup::"
          if [ $? -eq 0 ]; then
            echo -e "\033[32m✓ Tarball attestation verified successfully\033[0m"
          else
            echo -e "\033[31m✗ Tarball attestation verification failed\033[0m"
            exit 1
          fi

          # Verify toolshed binary attestation
          echo "::group::toolshed attestation details"
          gh attestation verify ./dist/toolshed -R ${{ github.repository }} --format json | jq
          echo "::endgroup::"
          if [ $? -eq 0 ]; then
            echo -e "\033[32m✓ toolshed attestation verified successfully\033[0m"
          else
            echo -e "\033[31m✗ toolshed attestation verification failed\033[0m"
            exit 1
          fi

          # Verify bg-piece-service binary attestation
          echo "::group::bg-piece-service attestation details"
          gh attestation verify ./dist/bg-piece-service -R ${{ github.repository }} --format json | jq
          echo "::endgroup::"
          if [ $? -eq 0 ]; then
            echo -e "\033[32m✓ bg-piece-service attestation verified successfully\033[0m"
          else
            echo -e "\033[31m✗ bg-piece-service attestation verification failed\033[0m"
            exit 1
          fi

          # Verify cf binary attestation
          echo "::group::cf attestation details"
          gh attestation verify ./dist/cf -R ${{ github.repository }} --format json | jq
          echo "::endgroup::"
          if [ $? -eq 0 ]; then
            echo -e "\033[32m✓ cf attestation verified successfully\033[0m"
          else
            echo -e "\033[31m✗ cf attestation verification failed\033[0m"
            exit 1
          fi

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1

      # A release artifact is named after the commit it was built from, and a
      # host keeps whatever it has already downloaded under that name. So the
      # first build of a commit publishes the artifact and a later build of the
      # same commit leaves it alone. Two builds of one commit do not produce the
      # same bytes: the binaries are compiled again, and `tar` records
      # modification times.
      #
      # The tarball and its checksum are published as a pair. A commit that has
      # one of them and not the other was published by a build that stopped
      # between the two copies, and this publishes both of them again. See "One
      # commit, one set of artifacts" in docs/development/deploying.md.
      - name: 📤 Upload artifacts to Google Cloud Storage
        run: |
          BUCKET=gs://commontools-build-artifacts/workspace-artifacts
          TARBALL=labs-${{ github.sha }}.tar.gz
          CHECKSUM=labs-${{ github.sha }}.hash.txt

          if gsutil -q stat "$BUCKET/$TARBALL" && gsutil -q stat "$BUCKET/$CHECKSUM"; then
            echo "An earlier build of ${{ github.sha }} published its artifacts; leaving them as they are."
          else
            gsutil cp "release/$TARBALL" "$BUCKET/"
            gsutil cp "release/$CHECKSUM" "$BUCKET/"
          fi

          # Print clickable links to the published files
          echo "::group::📦 Artifact Links"
          echo "Tarball URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.tar.gz"
          echo "Hash URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.hash.txt"

          # The combined coverage report is best-effort; upload it only if the
          # combine step produced it. To download it for a given commit:
          #   gsutil cp gs://commontools-build-artifacts/workspace-artifacts/labs-<commit-sha>.lcov .
          if [ -f release/labs-${{ github.sha }}.lcov ]; then
            gsutil cp "release/labs-${{ github.sha }}.lcov" "$BUCKET/"
            echo "Coverage LCOV URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.lcov"
          fi
          echo "::endgroup::"

  # Automatic deployment to staging (rapids)
  deploy-rapids:
    name: "Deploy to Rapids (Staging)"
    if: github.ref == 'refs/heads/main'
    needs: ["attest-binaries"]
    runs-on: ubuntu-latest
    environment: toolshed
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup
        with:
          cache: false

      - name: 🚀 Deploy application to Rapids (Staging)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: bastion
          key: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}
          script: /opt/cf/deploy.sh rapids ${{ github.sha }}
  # Deploy shell static assets to staging GCS bucket
  deploy-shell-staging:
    name: "Deploy Shell to Staging"
    if: github.ref == 'refs/heads/main'
    needs: ["full-tests"]
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # STAGING_SHELL_API_URL names the API host this shell talks to, which is
      # the host the deploy-rapids job above keeps current. It is a variable
      # rather than a secret because it is served in plaintext inside the
      # bundle, and because the checks below can then name it when they fail.
      - name: 🔎 Validate staging shell endpoints
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
          PRESENCE_URL: ${{ vars.STAGING_SHELL_PRESENCE_URL }}
        run: |
          # An empty API_URL builds a shell that falls back to its own origin,
          # which serves static assets and no API. Require a value up front, so
          # the build never runs with nothing to point at.
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty: the STAGING_SHELL_API_URL variable is unset."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ]; then
            PRESENCE_URL="$(deno eval '
              import { optionalPresenceUrl } from "./packages/shell/src/lib/presence-url.ts";
              console.log(optionalPresenceUrl(Deno.env.get("PRESENCE_URL"))?.href ?? "");
            ')"
            echo "PRESENCE_URL=$PRESENCE_URL" >> "$GITHUB_ENV"
          fi

      - name: 🏗️ Build shell with staging API URL
        working-directory: packages/shell
        run: |
          deno task production

          # The build substitutes API_URL into the bundle in place of the
          # `$API_URL` token. Confirm it landed before anything is uploaded.
          if ! grep -rqF -e "$API_URL" dist/scripts; then
            echo "::error::The built shell does not reference $API_URL."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ] && ! grep -rqF -e "$PRESENCE_URL" dist/scripts; then
            echo "::error::The built shell does not reference $PRESENCE_URL."
            exit 1
          fi
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
          COMMIT_SHA: ${{ github.sha }}

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1

      - name: 📤 Upload shell assets to Staging GCS
        run: |
          # Retain the complete immutable module graph for long-lived pages.
          gsutil -m rsync -r packages/shell/dist gs://staging-commontools-dev/builds/${{ github.sha }}/

          # Upload to bucket root as "latest" (-d removes orphaned files)
          gsutil -m rsync -r -d packages/shell/dist gs://staging-commontools-dev/

          echo "📦 Staging Shell deployed"
          echo "https://staging.commontools.dev/"

      - name: 🔎 Verify the published shell targets the staging API
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
        run: |
          # Read the scripts back out of the bucket, so this checks the uploaded
          # objects rather than the local build directory. Going to the bucket
          # rather than to the site's own URL also bypasses the CDN, which may
          # still be serving the previous build.
          gsutil cat "gs://staging-commontools-dev/scripts/*.js" > published-scripts.js
          if ! grep -qF -e "$API_URL" published-scripts.js; then
            echo "::error::The published shell does not reference $API_URL."
            exit 1
          fi
          echo "Published shell targets $API_URL"
          if [ -n "$PRESENCE_URL" ] && ! grep -qF -e "$PRESENCE_URL" published-scripts.js; then
            echo "::error::The published shell does not reference $PRESENCE_URL."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ]; then
            echo "Published shell targets presence service $PRESENCE_URL"
          fi
