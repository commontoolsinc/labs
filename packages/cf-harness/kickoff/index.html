<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cf-harness kickoff</title>
    <style>
      :root {
        --ink: #16181d;
        --muted: #6b7280;
        --line: #e3e5ea;
        --page: #fbfbfc;
        --accent: #1f6feb;
        --ok: #12805c;
        --bad: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      main {
        margin: 0 auto;
        max-width: 52rem;
        padding: 2.5rem 1.25rem 4rem;
      }

      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 1.25rem;
      }

      textarea {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        font: inherit;
        min-height: 6.5rem;
        padding: 0.75rem 0.85rem;
        resize: vertical;
        width: 100%;
      }

      textarea:focus,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .controls {
        align-items: center;
        display: flex;
        gap: 0.6rem;
        margin: 0.75rem 0 1.75rem;
      }

      button {
        background: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 7px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 0.45rem 1rem;
      }

      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--ink);
      }

      button[disabled] {
        cursor: default;
        opacity: 0.45;
      }

      #state {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: auto;
      }

      #piece {
        background: #fff;
        border: 1px solid var(--accent);
        border-radius: 8px;
        display: none;
        margin-bottom: 1.5rem;
        padding: 1rem 1.1rem;
      }

      #piece.shown {
        display: block;
      }

      #piece a {
        color: var(--accent);
        font-size: 1.05rem;
        font-weight: 600;
      }

      #piece .slug {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .entry {
        border-top: 1px solid var(--line);
        padding: 0.7rem 0;
      }

      .entry:first-child {
        border-top: none;
      }

      .label {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .label .tool {
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0;
        text-transform: none;
      }

      .label .ok {
        color: var(--ok);
      }

      .label .bad {
        color: var(--bad);
      }

      .body {
        margin-top: 0.3rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .body.code {
        color: #33383f;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
      }

      .final {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.85rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>cf-harness kickoff</h1>

      <textarea
        id="task"
        placeholder="Describe what you want built. The harness writes the pattern, runs it in your space, and names the piece."
      ></textarea>
      <div class="controls">
        <button id="start" type="button">Start</button>
        <button id="cancel" class="secondary" type="button" disabled>
          Cancel
        </button>
        <span id="state">idle</span>
      </div>

      <div id="piece">
        <a id="piece-link" href="#" rel="noopener" target="_blank">
          Open your piece
        </a>
        <div class="slug" id="piece-slug"></div>
      </div>

      <div id="feed"></div>
    </main>

    <script type="module">
      const task = document.querySelector("#task");
      const startButton = document.querySelector("#start");
      const cancelButton = document.querySelector("#cancel");
      const state = document.querySelector("#state");
      const feed = document.querySelector("#feed");
      const piece = document.querySelector("#piece");
      const pieceLink = document.querySelector("#piece-link");
      const pieceSlug = document.querySelector("#piece-slug");

      const MAX_SUMMARY = 600;

      let session = null;
      let turn = null;
      let stream = null;
      // The last sequence rendered. Every reconnect resumes from it, so the
      // feed is continuous across a dropped stream rather than replayed.
      let lastSequence = 0;

      const setState = (text) => {
        state.textContent = text;
      };

      const running = (isRunning) => {
        startButton.disabled = isRunning;
        cancelButton.disabled = !isRunning;
      };

      const truncate = (text) =>
        text.length > MAX_SUMMARY
          ? `${text.slice(0, MAX_SUMMARY)}\n… ${
            text.length - MAX_SUMMARY
          } more characters`
          : text;

      const append = (labelHtml, body, className) => {
        const entry = document.createElement("div");
        entry.className = "entry";
        const label = document.createElement("div");
        label.className = "label";
        label.innerHTML = labelHtml;
        entry.append(label);
        if (body !== undefined && body !== "") {
          const text = document.createElement("div");
          text.className = className === undefined
            ? "body"
            : `body ${className}`;
          text.textContent = body;
          entry.append(text);
        }
        feed.append(entry);
        entry.scrollIntoView({ block: "nearest" });
      };

      const escape = (value) =>
        String(value).replace(
          /[&<>]/g,
          (character) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character],
        );

      // assign_slug reports the named address it registered. Its result is the
      // tool message the model read, so the URL is read from there rather than
      // composed here — a space configured by DID carries no URL at all, and
      // this shows a link only when the harness produced one.
      const showPiece = (summary) => {
        let parsed;
        try {
          parsed = JSON.parse(summary ?? "");
        } catch {
          return;
        }
        if (typeof parsed?.url !== "string") {
          return;
        }
        pieceLink.href = parsed.url;
        pieceSlug.textContent = typeof parsed.slug === "string"
          ? `${parsed.slug} — ${parsed.url}`
          : parsed.url;
        piece.classList.add("shown");
      };

      const render = (envelope) => {
        lastSequence = envelope.sequence;
        const event = envelope.event;
        switch (event.kind) {
          case "session_started":
            append("session started");
            break;
          case "turn_started":
            setState("working");
            running(true);
            break;
          case "tool_started":
            append(
              `calling <span class="tool">${escape(event.tool.toolId)}</span>`,
              event.tool.inputSummary === undefined
                ? undefined
                : truncate(JSON.stringify(event.tool.inputSummary, null, 2)),
              "code",
            );
            break;
          case "tool_completed": {
            const good = event.status === "completed";
            append(
              `<span class="tool">${
                escape(event.tool.toolId)
              }</span> <span class="${good ? "ok" : "bad"}">${
                escape(event.status)
              }</span>`,
              event.resultSummary === undefined
                ? undefined
                : truncate(event.resultSummary),
              "code",
            );
            if (event.tool.toolId === "assign_slug" && good) {
              showPiece(event.resultSummary);
            }
            break;
          }
          case "assistant_completed":
            append("assistant", event.text);
            break;
          case "turn_completed":
            setState("done");
            running(false);
            if (event.finalText !== undefined && event.finalText !== "") {
              const entry = document.createElement("div");
              entry.className = "entry final";
              entry.textContent = event.finalText;
              feed.append(entry);
              entry.scrollIntoView({ block: "nearest" });
            }
            break;
          case "turn_canceled":
            setState("canceling");
            break;
          case "turn_failed":
            setState("failed");
            running(false);
            append("turn failed", event.error.message);
            break;
          case "error":
            append("error", event.error.message);
            break;
          default:
            break;
        }
      };

      // EventSource reconnects on its own; the query carries the last sequence
      // rendered so the reconnect resumes rather than replays.
      const subscribe = () => {
        stream?.close();
        stream = new EventSource(
          `/api/events?sessionId=${
            encodeURIComponent(session)
          }&afterSequence=${lastSequence}`,
        );
        stream.addEventListener("chat", (message) => {
          render(JSON.parse(message.data));
        });
        stream.addEventListener("error", () => {
          // A closed stream is reopened from the sequence already rendered, so
          // the resume point advances with the feed.
          if (stream.readyState === EventSource.CLOSED) {
            subscribe();
          }
        });
      };

      startButton.addEventListener("click", async () => {
        const text = task.value.trim();
        if (text === "") {
          return;
        }
        running(true);
        setState("starting");
        feed.replaceChildren();
        piece.classList.remove("shown");
        lastSequence = 0;
        const response = await fetch("/api/task", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const body = await response.json();
        if (!response.ok) {
          running(false);
          setState("failed");
          append("could not start", body.error ?? response.statusText);
          return;
        }
        session = body.sessionId;
        turn = body.turnId;
        subscribe();
      });

      cancelButton.addEventListener("click", async () => {
        if (session === null) {
          return;
        }
        setState("canceling");
        await fetch("/api/cancel", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sessionId: session, turnId: turn }),
        });
      });
    </script>
  </body>
</html>
