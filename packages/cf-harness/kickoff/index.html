<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cf-harness kickoff</title>
    <style>
      :root {
        --ink: #16181d;
        --muted: #6b7280;
        --line: #e3e5ea;
        --page: #fbfbfc;
        --accent: #1f6feb;
        --ok: #12805c;
        --bad: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      main {
        margin: 0 auto;
        max-width: 52rem;
        padding: 2.5rem 1.25rem 4rem;
      }

      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 1.25rem;
      }

      textarea {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        font: inherit;
        min-height: 6.5rem;
        padding: 0.75rem 0.85rem;
        resize: vertical;
        width: 100%;
      }

      textarea:focus,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .controls {
        align-items: center;
        display: flex;
        gap: 0.6rem;
        margin: 0.75rem 0 1.75rem;
      }

      button {
        background: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 7px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        padding: 0.45rem 1rem;
      }

      button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--ink);
      }

      button[disabled] {
        cursor: default;
        opacity: 0.45;
      }

      #state {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: auto;
      }

      #piece {
        background: #fff;
        border: 1px solid var(--accent);
        border-radius: 8px;
        display: none;
        margin-bottom: 1.5rem;
        padding: 1rem 1.1rem;
      }

      #piece.shown {
        display: block;
      }

      #piece a {
        color: var(--accent);
        font-size: 1.05rem;
        font-weight: 600;
      }

      #piece .slug {
        color: var(--muted);
        font-size: 0.85rem;
      }

      #sessions:not(:empty) {
        margin-bottom: 1.75rem;
      }

      .session {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        display: block;
        margin-bottom: 0.5rem;
        padding: 0.6rem 0.85rem;
        text-decoration: none;
      }

      .session:hover {
        border-color: var(--accent);
      }

      .session-task {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-meta {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .entry {
        border-top: 1px solid var(--line);
        padding: 0.7rem 0;
      }

      .entry:first-child {
        border-top: none;
      }

      .label {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .label .tool {
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0;
        text-transform: none;
      }

      .label .ok {
        color: var(--ok);
      }

      .label .bad {
        color: var(--bad);
      }

      .body {
        margin-top: 0.3rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .body.code {
        color: #33383f;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
      }

      .final {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.85rem 1rem;
      }

      .subagent {
        border-left: 2px solid var(--accent);
        margin: 0.5rem 0 0.2rem 0.35rem;
        padding-left: 0.85rem;
      }

      .subagent .entry:first-child {
        border-top: 1px solid var(--line);
      }

      .subagent-header {
        color: var(--accent);
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .subagent-goal {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 0.15rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>cf-harness kickoff</h1>

      <textarea
        id="task"
        placeholder="Describe what you want built. The harness writes the pattern, runs it in your space, and names the piece."
      ></textarea>
      <div class="controls">
        <button id="start" type="button">Start</button>
        <button id="cancel" class="secondary" type="button" disabled>
          Cancel
        </button>
        <button id="new-session" class="secondary" type="button" hidden>
          New session
        </button>
        <span id="state">idle</span>
      </div>

      <div id="sessions"></div>

      <div id="piece">
        <a id="piece-link" href="#" rel="noopener" target="_blank">
          Open your piece
        </a>
        <div class="slug" id="piece-slug"></div>
      </div>

      <div id="feed"></div>
    </main>

    <script type="module">
      const task = document.querySelector("#task");
      const startButton = document.querySelector("#start");
      const cancelButton = document.querySelector("#cancel");
      const newSessionButton = document.querySelector("#new-session");
      const state = document.querySelector("#state");
      const feed = document.querySelector("#feed");
      const sessions = document.querySelector("#sessions");
      const piece = document.querySelector("#piece");
      const pieceLink = document.querySelector("#piece-link");
      const pieceSlug = document.querySelector("#piece-slug");

      const MAX_SUMMARY = 600;

      let session = null;
      let turn = null;
      let stream = null;
      // The last sequence rendered. Every reconnect resumes from it, so the
      // feed is continuous across a dropped stream rather than replayed.
      let lastSequence = 0;

      const setState = (text) => {
        state.textContent = text;
      };

      const running = (isRunning) => {
        startButton.disabled = isRunning;
        cancelButton.disabled = !isRunning;
      };

      const truncate = (text) =>
        text.length > MAX_SUMMARY
          ? `${text.slice(0, MAX_SUMMARY)}\n… ${
            text.length - MAX_SUMMARY
          } more characters`
          : text;

      const append = (labelHtml, body, className, container = feed) => {
        const entry = document.createElement("div");
        entry.className = "entry";
        const label = document.createElement("div");
        label.className = "label";
        label.innerHTML = labelHtml;
        entry.append(label);
        if (body !== undefined && body !== "") {
          const text = document.createElement("div");
          text.className = className === undefined
            ? "body"
            : `body ${className}`;
          text.textContent = body;
          entry.append(text);
        }
        container.append(entry);
        entry.scrollIntoView({ block: "nearest" });
        return entry;
      };

      // The entry a tool call opened, so a subagent's activity can be nested
      // inside the delegate_task entry that started it, and the block that
      // holds a running subagent's own entries.
      const toolEntries = new Map();
      const subagentBlocks = new Map();

      // A tagged event belongs inside its subagent's block; an untagged one,
      // and a tagged one whose block was pruned by a resumed stream, belong in
      // the feed.
      const containerFor = (event) =>
        event.subagent === undefined
          ? feed
          : subagentBlocks.get(event.subagent.parentToolCallId) ?? feed;

      const openSubagent = (subagent) => {
        const block = document.createElement("div");
        block.className = "subagent";
        const header = document.createElement("div");
        header.className = "subagent-header";
        header.innerHTML = `subagent <span class="tool">${
          escape(subagent.profile)
        }</span>`;
        block.append(header);
        if (typeof subagent.goal === "string" && subagent.goal !== "") {
          const goal = document.createElement("div");
          goal.className = "subagent-goal";
          goal.textContent = truncate(subagent.goal);
          block.append(goal);
        }
        const host = toolEntries.get(subagent.parentToolCallId) ?? feed;
        host.append(block);
        subagentBlocks.set(subagent.parentToolCallId, block);
        block.scrollIntoView({ block: "nearest" });
      };

      const escape = (value) =>
        String(value).replace(
          /[&<>]/g,
          (character) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character],
        );

      // assign_slug reports the named address it registered. Its result is the
      // tool message the model read, so the URL is read from there rather than
      // composed here — a space configured by DID carries no URL at all, and
      // this shows a link only when the harness produced one.
      const showPiece = (summary) => {
        let parsed;
        try {
          parsed = JSON.parse(summary ?? "");
        } catch {
          return;
        }
        if (typeof parsed?.url !== "string") {
          return;
        }
        pieceLink.href = parsed.url;
        pieceSlug.textContent = typeof parsed.slug === "string"
          ? `${parsed.slug} — ${parsed.url}`
          : parsed.url;
        piece.classList.add("shown");
      };

      const render = (envelope) => {
        lastSequence = envelope.sequence;
        const event = envelope.event;
        switch (event.kind) {
          case "session_started":
            append("session started");
            break;
          case "turn_started":
            // The turn is read back off the stream rather than only from the
            // response that started it, so a page opened on a session it did
            // not start can still cancel the turn that session is running.
            turn = event.turn.turnId;
            setState("working");
            running(true);
            break;
          case "tool_started": {
            const entry = append(
              `calling <span class="tool">${escape(event.tool.toolId)}</span>`,
              event.tool.inputSummary === undefined
                ? undefined
                : truncate(JSON.stringify(event.tool.inputSummary, null, 2)),
              "code",
              containerFor(event),
            );
            toolEntries.set(event.tool.toolCallId, entry);
            break;
          }
          case "tool_completed": {
            const good = event.status === "completed";
            append(
              `<span class="tool">${
                escape(event.tool.toolId)
              }</span> <span class="${good ? "ok" : "bad"}">${
                escape(event.status)
              }</span>`,
              event.resultSummary === undefined
                ? undefined
                : truncate(event.resultSummary),
              "code",
              containerFor(event),
            );
            if (event.tool.toolId === "assign_slug" && good) {
              showPiece(event.resultSummary);
            }
            break;
          }
          case "subagent_started":
            openSubagent(event.subagent);
            break;
          case "subagent_completed": {
            const good = event.status === "completed";
            append(
              `subagent <span class="${good ? "ok" : "bad"}">${
                escape(event.status)
              }</span>`,
              undefined,
              undefined,
              subagentBlocks.get(event.subagent.parentToolCallId) ?? feed,
            );
            subagentBlocks.delete(event.subagent.parentToolCallId);
            break;
          }
          case "assistant_completed":
            append("assistant", event.text, undefined, containerFor(event));
            break;
          case "turn_completed":
            setState("done");
            running(false);
            if (event.finalText !== undefined && event.finalText !== "") {
              const entry = document.createElement("div");
              entry.className = "entry final";
              entry.textContent = event.finalText;
              feed.append(entry);
              entry.scrollIntoView({ block: "nearest" });
            }
            break;
          case "turn_canceled":
            setState("canceling");
            break;
          case "turn_failed":
            setState("failed");
            running(false);
            append("turn failed", event.error.message);
            break;
          case "error":
            append("error", event.error.message);
            break;
          default:
            break;
        }
      };

      // EventSource reconnects on its own; the query carries the last sequence
      // rendered so the reconnect resumes rather than replays.
      const subscribe = () => {
        stream?.close();
        stream = new EventSource(
          `/api/events?sessionId=${
            encodeURIComponent(session)
          }&afterSequence=${lastSequence}`,
        );
        stream.addEventListener("chat", (message) => {
          render(JSON.parse(message.data));
        });
        stream.addEventListener("error", () => {
          // A closed stream is reopened from the sequence already rendered, so
          // the resume point advances with the feed.
          if (stream.readyState === EventSource.CLOSED) {
            subscribe();
          }
        });
      };

      // The session in the address bar is the whole of the page's state: a link
      // to one is a link to its transcript, and the stream replayed from the
      // sequence already rendered is what draws it.
      const openSession = (sessionId) => {
        session = sessionId;
        history.replaceState(
          null,
          "",
          `?sessionId=${encodeURIComponent(sessionId)}`,
        );
        sessions.replaceChildren();
        startButton.textContent = "Send";
        newSessionButton.hidden = false;
        subscribe();
      };

      const sessionRow = (summary) => {
        const row = document.createElement("a");
        row.className = "session";
        row.href = `?sessionId=${encodeURIComponent(summary.sessionId)}`;
        const title = document.createElement("div");
        title.className = "session-task";
        title.textContent = summary.firstTaskText ?? summary.sessionId;
        const meta = document.createElement("div");
        meta.className = "session-meta";
        meta.textContent = `${summary.status} · ${summary.turnCount} turn${
          summary.turnCount === 1 ? "" : "s"
        } · ${new Date(summary.updatedAt).toLocaleString()}`;
        row.append(title, meta);
        return row;
      };

      const listSessions = async () => {
        const response = await fetch("/api/sessions");
        if (!response.ok) {
          return;
        }
        const body = await response.json();
        sessions.replaceChildren(...body.sessions.map(sessionRow));
      };

      startButton.addEventListener("click", async () => {
        const text = task.value.trim();
        if (text === "") {
          return;
        }
        running(true);
        setState("starting");
        // A follow-up turn continues the feed it is answering into; a new
        // session starts from an empty one.
        if (session === null) {
          feed.replaceChildren();
          toolEntries.clear();
          subagentBlocks.clear();
          piece.classList.remove("shown");
          lastSequence = 0;
        }
        const response = await fetch("/api/task", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(
            session === null ? { text } : { text, sessionId: session },
          ),
        });
        const body = await response.json();
        if (!response.ok) {
          running(false);
          setState("failed");
          append("could not start", body.error ?? response.statusText);
          return;
        }
        task.value = "";
        turn = body.turnId;
        if (session === null) {
          openSession(body.sessionId);
        }
      });

      newSessionButton.addEventListener("click", () => {
        location.href = location.pathname;
      });

      cancelButton.addEventListener("click", async () => {
        if (session === null) {
          return;
        }
        setState("canceling");
        await fetch("/api/cancel", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sessionId: session, turnId: turn }),
        });
      });

      // A session named in the address is replayed from the start, so a reload
      // and a shared link both draw the same transcript a live run drew; with
      // no session named, the page offers the ones it already has.
      const named = new URLSearchParams(location.search).get("sessionId");
      if (named !== null && named !== "") {
        setState("loading");
        openSession(named);
      } else {
        listSessions();
      }
    </script>
  </body>
</html>
