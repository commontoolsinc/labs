\* The frame-time doom under the identity exemption: a hidden layer whose
\* stale write changes nothing is accepted with its writes elided, and a
\* layer hidden by cascade may be accepted with writes once its dependency
\* is elided, which is why a hidden layer leaves the view and is not
\* rejected locally. Single-path writes, the ChannelIdentity bound.
\* EXPECTED: all invariants HOLD, HiddenNeverWrote included.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Sessions = {"s1", "s2"}
  Paths = {"p1", "p2"}
  Values = {"a", "b"}
  MaxTotal = 4
  DepMode = "fullstack"
  BasisMode = "confirmed"
  DeliveryMode = "channel"
  IdentityMode = "elide"
  DoomMode = "frame"
WriteChoices <- SingletonWrites
INVARIANT TypeOK
INVARIANT ContentCoherence
INVARIANT ElidedUnchanged
INVARIANT CascadeTotality
INVARIANT MonotonicResolution
INVARIANT AcceptedVersusDropped
INVARIANT HiddenNeverWrote
INVARIANT VisibleNamesVisible
