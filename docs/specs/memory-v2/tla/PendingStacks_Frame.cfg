\* The frame-time doom (03-commit-model.md section 3.5): a layer whose
\* confirmed read an integrated entry proves stale leaves the view at
\* Integrate, with every layer whose dependency array reaches it, while the
\* server still decides it. Atomic delivery, the shipped recording and
\* basis. EXPECTED: all invariants HOLD, HiddenNeverWrote and
\* VisibleNamesVisible included.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Sessions = {"s1", "s2"}
  Paths = {"p1", "p2"}
  MaxTotal = 4
  DepMode = "fullstack"
  BasisMode = "confirmed"
  Values = {"v"}
  DeliveryMode = "atomic"
  IdentityMode = "none"
  DoomMode = "frame"
INVARIANT TypeOK
INVARIANT ReadCoherence
INVARIANT CascadeTotality
INVARIANT MonotonicResolution
INVARIANT HiddenNeverWrote
INVARIANT VisibleNamesVisible
