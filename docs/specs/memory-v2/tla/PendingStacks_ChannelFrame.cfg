\* The frame-time doom composed with delayed verdict delivery: a hidden
\* layer stands on the stack through the parking window, its verdict is
\* processed by Deliver like any other, and a build in that window sits on
\* the visible stack alone. EXPECTED: all invariants HOLD,
\* AcceptedVersusDropped included - a hidden layer is never rejected
\* locally, so localrej is untouched by the hide.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Sessions = {"s1", "s2"}
  Paths = {"p1", "p2"}
  MaxTotal = 4
  DepMode = "fullstack"
  BasisMode = "confirmed"
  Values = {"v"}
  DeliveryMode = "channel"
  IdentityMode = "none"
  DoomMode = "frame"
INVARIANT TypeOK
INVARIANT ReadCoherence
INVARIANT CascadeTotality
INVARIANT MonotonicResolution
INVARIANT AcceptedVersusDropped
INVARIANT HiddenNeverWrote
INVARIANT VisibleNamesVisible
